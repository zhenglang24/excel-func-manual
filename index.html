<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel 函数宝典 · 427 个函数 · 场景化学习 · 功能对比选型</title>
<style>
:root{
--bg:#F4F6F3;--card:#FFFFFF;--ink:#18211D;--mut:#66756C;--bd:#E2E7E2;--bd2:#EEF1ED;
--pri:#0B6E4F;--pri2:#095C42;--pril:#E3F2EA;--amber:#A2731B;--amberl:#FBF2DF;
--red:#B23A32;--redl:#FBEAE8;--blue:#2C5F8A;--bluel:#E9F1F8;--pur:#6B4E9B;--purl:#F1ECF9;
--code:#101F19;--codeink:#A8E6C8;--shadow:0 1px 2px rgba(24,33,29,.05),0 4px 14px rgba(24,33,29,.05);
--mono:"Cascadia Mono",Consolas,"SF Mono","Courier New",monospace;
}
html[data-theme="dark"]{
--bg:#0F1412;--card:#161C19;--ink:#E4EAE6;--mut:#93A29A;--bd:#26302B;--bd2:#1E2622;
--pri:#31A87C;--pri2:#3FC092;--pril:#12352A;--amber:#D9A648;--amberl:#2E2513;
--red:#E0695F;--redl:#331B18;--blue:#79AED8;--bluel:#142838;--pur:#A98EDB;--purl:#241C36;
--code:#0A1512;--codeink:#8FE0BE;--shadow:0 1px 2px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--pri);text-decoration:none}
button{font-family:inherit}
mark{background:#FCE9A8;color:#5C4403;border-radius:3px;padding:0 1px}
html[data-theme="dark"] mark{background:#4A3A0E;color:#F0D179}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--bd)}
.bar{max-width:1260px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:9px 18px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.brand .lg{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#12A271,#0A5C42);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(11,110,79,.3)}
.brand b{display:block;font-size:15px;letter-spacing:.3px;line-height:1.25}
.brand i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);letter-spacing:.2px}
.tabs{display:flex;gap:2px;flex-shrink:0}
.tab{border:none;background:none;color:var(--mut);font-size:13px;padding:6px 11px;border-radius:8px;cursor:pointer;transition:all .13s;white-space:nowrap}
.tab:hover{background:var(--bd2);color:var(--ink)}
.tab.on{background:var(--pril);color:var(--pri);font-weight:600}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.srch{position:relative;width:290px}
.srch input{width:100%;padding:7px 12px 7px 32px;border:1.5px solid var(--bd);border-radius:9px;font-size:13px;outline:none;background:var(--bg);color:var(--ink);transition:all .15s}
.srch input:focus{border-color:var(--pri);background:var(--card);box-shadow:0 0 0 3px rgba(11,110,79,.12)}
.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--mut);fill:none;stroke-width:2}
.srch .kbdhint{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--mut);border:1px solid var(--bd);border-radius:4px;padding:0 5px;background:var(--card)}
.iconbtn{width:32px;height:32px;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .13s}
.iconbtn:hover{color:var(--pri);border-color:var(--pri)}

/* ============ 通用 ============ */
.view{max-width:1260px;margin:0 auto;padding:16px 18px 70px}
.view[hidden]{display:none}
.sect{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:26px 0 11px}
.sect::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--pri)}
.sect .hint{font-size:11.5px;color:var(--mut);font-weight:400}
.mono{font-family:var(--mono)}
.badge{font-size:10.5px;border-radius:5px;padding:1.5px 7px;font-weight:600;white-space:nowrap;display:inline-block}
.b-hot{background:var(--redl);color:var(--red)}
.b-fx{background:var(--pril);color:var(--pri)}
.b-new{background:var(--bluel);color:var(--blue)}
.b-cat{background:var(--bd2);color:var(--mut)}
.b-fav{background:var(--amberl);color:var(--amber)}
.empty{text-align:center;padding:56px 20px;color:var(--mut);font-size:13.5px;line-height:2}
.dense{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:6px 8px}
.drow{display:flex;gap:9px;align-items:baseline;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12.3px;border-bottom:1px solid var(--bd2)}
.drow:hover{background:var(--bd2)}
.drow b{font-family:var(--mono);font-size:12px;font-weight:600;min-width:132px;flex-shrink:0}
.drow span{flex:1;min-width:0;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:940px){.dense{grid-template-columns:minmax(0,1fr)}.drow b{min-width:104px}}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 13px;font-size:12.5px;cursor:pointer;transition:all .13s;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2);color:#fff}
.btn.sm{padding:3px 10px;font-size:11.5px}
.btnicon{border:none;background:none;cursor:pointer;color:var(--mut);font-size:13px;padding:2px 6px;border-radius:6px;line-height:1}
.btnicon:hover{background:var(--bd2);color:var(--ink)}
.star{color:#C9A227;font-size:15px;line-height:1}

/* ============ 函数库 ============ */
.libwrap{display:flex;gap:22px;align-items:flex-start}
.rail{width:198px;flex-shrink:0;position:sticky;top:72px;max-height:calc(100vh - 92px);overflow-y:auto;padding-bottom:20px}
.rail h4{font-size:10.5px;letter-spacing:1.4px;color:var(--mut);margin:16px 0 5px;font-weight:700}
.rail h4:first-child{margin-top:2px}
.ritem{display:flex;align-items:center;gap:8px;padding:6.5px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink);margin-bottom:1px;transition:background .12s}
.ritem:hover{background:var(--bd2)}
.ritem .dt{width:8px;height:8px;border-radius:3px;flex-shrink:0;background:var(--pri)}
.ritem .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .ct{font-size:10.5px;color:var(--mut)}
.ritem.on{background:var(--pril);font-weight:600;color:var(--pri);box-shadow:inset 3px 0 0 var(--pri)}
.ritem.on .ct{color:var(--pri)}
.libmain{flex:1;min-width:0}
.hero{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:6px}
@media (max-width:1100px){.hero{grid-template-columns:repeat(3,1fr)}}
.hcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;transition:all .14s}
.hcard[onclick]:hover{border-color:var(--pri);box-shadow:var(--shadow);transform:translateY(-1px)}
.hcard b{display:block;font-size:20px;font-weight:700;color:var(--pri);line-height:1.25}
.hcard span{font-size:11px;color:var(--mut);display:block;margin-top:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 12px}
.chip{font-size:12px;padding:4px 11px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--mut);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.lthead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 12px;gap:10px;flex-wrap:wrap}
.lthead h2{margin:0;font-size:17px;font-weight:700}
.lthead span{font-size:11.5px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:11px}
.fcard{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:12px 14px 12px 16px;cursor:pointer;transition:all .15s;overflow:hidden}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc,var(--pri));opacity:.6}
.fcard:hover{border-color:var(--cc,var(--pri));box-shadow:var(--shadow);transform:translateY(-1px)}
.fcard .nm{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px;padding-right:22px}
.fcard .nm b{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--cc,var(--pri))}
.fcard p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.fcard .fs{position:absolute;right:7px;top:7px;font-size:13px;color:#D9D3B8;background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:5px;line-height:1}
.fcard .fs:hover{background:var(--amberl);color:var(--amber)}
.fcard .fs.on{color:#D4A017}

/* ============ 详情 ============ */
.back{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:5px 14px;font-size:12.5px;cursor:pointer;color:var(--mut);margin-bottom:16px}
.back:hover{color:var(--pri);border-color:var(--pri)}
.dtop{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.dtop h2{margin:0;font-family:var(--mono);font-size:24px;font-weight:700;color:var(--cc,var(--pri));line-height:1.2}
.dtop .bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dacts{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ddesc{font-size:14px;margin:12px 0 0}
.dsub{font-size:12.5px;color:var(--mut);margin:5px 0 0}
.syntax{display:flex;align-items:center;gap:10px;background:var(--code);border-radius:10px;padding:11px 15px}
.syntax code{font-family:var(--mono);font-size:13px;color:var(--codeink);flex:1;overflow-x:auto;white-space:pre}
.cpbtn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:4px 12px;font-size:11.5px;cursor:pointer;color:#D7F5E8;flex-shrink:0}
.cpbtn:hover{background:rgba(255,255,255,.2)}
.ptable{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
.ptable th{text-align:left;padding:7px 11px;border-bottom:1px solid var(--bd);font-weight:600;color:var(--mut);font-size:11.5px;background:var(--bd2)}
.ptable td{padding:8px 11px;border-bottom:1px solid var(--bd2);vertical-align:top;font-size:12.8px}
.ptable tr:last-child td{border-bottom:none}
.ptable .pn{font-family:var(--mono);color:var(--pri);font-weight:600;white-space:nowrap}
.ptable .req{font-size:10.5px;font-weight:600;text-align:center}
.ptable .req.y{color:var(--red)}.ptable .req.n{color:var(--mut)}
.ptable .pmore{display:inline-block;margin-left:5px;padding:0 4px;font-size:9.5px;font-weight:600;color:var(--mut);background:var(--bd2);border:1px solid var(--bd);border-radius:4px;vertical-align:1px;font-family:inherit}
.ptable .pv{font-size:11.6px;line-height:1.65}
.ptable .popt{display:block;color:var(--ink)}
.ptable .pdef{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.ptable .pnone{color:var(--mut)}
.exline{font-family:var(--mono);font-size:12.5px;color:var(--ink);padding:8px 12px;border-left:3px solid var(--pri);margin:7px 0;background:var(--card);border-radius:0 8px 8px 0;border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);white-space:pre-wrap;word-break:break-word;display:flex;gap:10px;align-items:flex-start}
.exline .t{flex:1}
.exline .arr{color:var(--amber)}
.pit{border:1px solid var(--bd);border-left:3px solid var(--red);border-radius:0 9px 9px 0;padding:9px 13px;margin:7px 0;background:var(--card);font-size:12.8px}
.pit b{color:var(--red);font-weight:600;display:block;margin-bottom:1px;font-size:12.5px}
.pit code{font-family:var(--mono);background:var(--bd2);border-radius:4px;padding:0 5px;font-size:12px}
.relchips{display:flex;gap:6px;flex-wrap:wrap}
.relchip{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:16px;border:1px solid var(--bd);background:var(--card);cursor:pointer;color:var(--ink)}
.relchip:hover{border-color:var(--pri);color:var(--pri);background:var(--pril)}

/* ============ 交互表格 ============ */
.demo{border:1px solid var(--bd);border-radius:12px;padding:13px 15px;background:var(--card)}
.demo .cap{font-size:11.5px;color:var(--mut);margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo .cap .hint{background:var(--pril);color:var(--pri);border-radius:5px;padding:1px 8px;font-size:10.5px;font-weight:600}
.xlwrap{overflow-x:auto;margin:6px 0 4px}
.xlt{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap}
.xlt th{border:1px solid var(--bd);border-top:none;border-left:none;background:var(--bd2);padding:3px 9px;color:var(--mut);font-size:10.5px;font-weight:600;text-align:center;position:relative}
.xlt th:first-child{border-left:1px solid var(--bd);min-width:32px}
.xlt thead th{border-top:1px solid var(--bd);background:var(--bd2);color:var(--ink);font-size:11.5px}
.xlt td{border:1px solid var(--bd);border-top:none;border-left:none;padding:4px 11px;text-align:center;background:var(--card);color:var(--ink);min-width:56px;transition:background .1s}
.xlt td:last-child{border-right:1px solid var(--bd)}
.xlt thead th:last-child{border-right:1px solid var(--bd)}
.xlt td.ed{background:var(--pril);background:color-mix(in srgb,var(--pril) 55%,var(--card));cursor:text;outline:none}
.xlt td.ed:hover{background:var(--pril)}
.xlt td.ed:focus{background:var(--card);box-shadow:inset 0 0 0 2px var(--pri)}
.xlt td.ed:empty::before{content:"输入";color:var(--mut);opacity:.45;font-size:10px}
.xlt td.fc{background:var(--amberl);font-weight:700;color:var(--amber)}
/* 第一行是表头（和 Excel 一致，A1 就是第一个字段名），视觉上压暗一点 */
.xlt tbody tr:first-child td{background:var(--bd2);font-weight:600;color:var(--mut)}
.xlt tbody tr:first-child td.ed:hover{background:var(--pril)}
.xlt .rdel{position:absolute;top:50%;right:1px;transform:translateY(-50%);width:14px;height:14px;border:none;border-radius:4px;background:transparent;color:var(--mut);font-size:10px;line-height:1;cursor:pointer;padding:0;opacity:0;transition:opacity .1s}
.xlt tr:hover .rdel{opacity:.7}
.xlt .rdel:hover{background:var(--redl);color:var(--red);opacity:1}
.xlact{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.fxline{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:7px 10px;margin:7px 0;flex-wrap:nowrap}
.fxline .pf{color:var(--amber);font-size:11px;font-family:var(--mono);font-style:italic;flex-shrink:0}
.fxline .fxin{flex:1;min-width:100px;border:1.5px solid transparent;border-radius:6px;background:var(--bg);font-family:var(--mono);font-size:12.5px;color:var(--pri);padding:4px 9px;outline:none;transition:all .13s}
.fxline .fxin:focus{border-color:var(--pri);background:var(--card);box-shadow:0 0 0 3px rgba(11,110,79,.1)}
.fxline .res{color:var(--amber);background:var(--amberl);border-radius:6px;padding:2px 10px;font-size:12px;font-family:var(--mono);white-space:nowrap;max-width:38%;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.fxline .res.err{background:var(--redl);color:var(--red)}
.tsteps{border:1px dashed var(--bd);border-radius:9px;padding:8px 12px;margin:0 0 9px;background:var(--bg)}
.tsteps .tt{font-size:11px;color:var(--mut);margin-bottom:5px;letter-spacing:.5px}
.tstep{display:flex;gap:8px;align-items:baseline;font-size:12px;padding:2.5px 0;border-bottom:1px dotted var(--bd)}
.tstep:last-child{border-bottom:none}
.tstep .tn{width:16px;flex-shrink:0;color:var(--mut);font-size:10px;text-align:right}
.tstep code{font-family:var(--mono);color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tstep .tv{font-family:var(--mono);color:var(--amber);flex-shrink:0}
.tstep.last code{color:var(--pri);font-weight:600}
.note{font-size:12px;color:var(--mut);line-height:1.8;margin:9px 0 0}
.note b{color:var(--ink)}

/* ============ 场景实战 ============ */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:15px 16px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.scard:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--sc,var(--pri))}
.scard .sic{width:34px;height:34px;border-radius:9px;background:var(--scl,var(--pril));color:var(--sc,var(--pri));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:var(--mono);margin-bottom:9px}
.scard h3{margin:0 0 3px;font-size:14.5px}
.scard p{margin:0;font-size:12.3px;color:var(--mut);line-height:1.6;min-height:38px}
.scard .cnt{font-size:11px;color:var(--sc,var(--pri));font-weight:600;margin-top:8px}
.tpl{border:1px solid var(--bd);border-radius:12px;padding:13px 15px;margin-bottom:11px;background:var(--card)}
.tpl h4{margin:0 0 3px;font-size:13.8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tpl .d{font-size:12.5px;color:var(--mut);margin:0 0 8px;line-height:1.65}
.tplfns{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tplfns .rc{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:12px;background:var(--pril);color:var(--pri);cursor:pointer;font-weight:600}
.tplfns .rc:hover{background:var(--pri);color:#fff}
.tplact{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.tplres{font-size:12px;color:var(--amber);font-family:var(--mono);background:var(--amberl);border-radius:6px;padding:2px 9px}
.tplres.err{color:var(--red);background:var(--redl)}
.dsprev{border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--card)}
.dsprev summary{cursor:pointer;padding:8px 12px;font-size:12px;color:var(--mut);list-style:none;user-select:none}
.dsprev summary::-webkit-details-marker{display:none}
.dsprev summary::before{content:"▸ ";color:var(--pri)}
.dsprev[open] summary::before{content:"▾ "}
.dsprev summary:hover{color:var(--pri)}
.dsprev table{border-collapse:collapse;width:100%;font-size:11.5px}
.dsprev th,.dsprev td{border-bottom:1px solid var(--bd2);padding:3px 9px;text-align:left;white-space:nowrap}
.dsprev th{background:var(--bd2);color:var(--mut);font-weight:600;font-size:10.5px}
.dsprev tr:last-child td{border-bottom:none}
.dsprev .more{color:var(--mut);font-size:10.5px;padding:3px 9px}

/* ============ 排错 ============ */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:6px 0 16px}
.stab{border:none;background:none;padding:8px 14px;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.stab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ecard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.ecard .ec{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--red);line-height:1.2}
.ecard .en{font-size:13px;font-weight:600;margin:1px 0 8px}
.ecard h6{margin:9px 0 4px;font-size:11px;letter-spacing:.8px;color:var(--mut);font-weight:700}
.ecard ul,.ecard ol{margin:0;padding-left:18px;font-size:12.3px;color:var(--ink);line-height:1.75}
.ecard li{margin-bottom:2px}

{n:"TRIM",d:"清理文字首尾及中间多余的空格，导入数据清洗必备",s:"=TRIM(文本)",fx:{cols:["原始文本","清理后"],rows:[["原始文本","结果"],["  张三   李四  ",""],["Hello   World ",""]],formulas:[{fx:'="["&TRIM(A2)&"]"',cell:[1,1]},{fx:'="["&TRIM(A3)&"]"',cell:[2,1]}],note:"加了方括号让你看清 TRIM 的效果：首尾空格全去、中间多个空格合成一个。"}},
{n:"CONCAT",newx:1,d:"把多个单元格的文字连接在一起",s:"=CONCAT(文本1, 文本2, …)",ex:['=CONCAT(A2, "-", B2) → 等价写法 =A2&"-"&B2','=CONCAT(A2:A5) → 把一片区域连成一串']},
{n:"TEXTJOIN",newx:1,d:"带分隔符的智能拼接，还能跳过空单元格",s:"=TEXTJOIN(分隔符, 是否忽略空格, 文本…)",ex:['=TEXTJOIN("-", TRUE, A2:C2) → 三个格子用 - 连接，空格自动跳过']},
{n:"FIND",d:"查找某字符在文本中的位置（区分大小写，不支持通配符）",s:"=FIND(要找的字符, 在哪找, [起始位])",ex:['=FIND("@", "abc@163.com") → 4（@ 在第 4 位）']},
{n:"SEARCH",d:"与 FIND 类似但不区分大小写、支持通配符",s:"=SEARCH(要找的字符, 在哪找, [起始位])",ex:['=SEARCH("a", "Excel") → 1（不区分大小写）']},
{n:"SUBSTITUTE",d:"把文本中的指定内容替换掉，手机号脱敏常用",s:"=SUBSTITUTE(文本, 旧内容, 新内容, [替换第几个])",fx:{cols:["手机号","脱敏后"],rows:[["手机号","结果"],["13812345678",""],["15988887777",""]],formulas:[{fx:'=SUBSTITUTE(A2, MID(A2, 4, 4), "****")',cell:[1,1]},{fx:'=SUBSTITUTE(A3, MID(A3, 4, 4), "****")',cell:[2,1]}],note:"先 MID 取出中间 4 位，再替换成 ****。也可以直接写 =REPLACE(A2, 4, 4, \"****\")。"}},
{n:"REPLACE",d:"按位置替换：把第几位开始、长几度的内容换掉",s:"=REPLACE(文本, 开始位, 长度, 新内容)",ex:['=REPLACE("13812345678", 4, 4, "****") → 138****5678']},
{n:"UPPER",d:"英文全部转大写",s:"=UPPER(文本)",ex:['=UPPER("excel") → EXCEL']},
{n:"LOWER",d:"英文全部转小写",s:"=LOWER(文本)",ex:['=LOWER("EXCEL") → excel']},
{n:"PROPER",d:"每个单词首字母大写",s:"=PROPER(文本)",ex:['=PROPER("hello world") → Hello World']},
{n:"VALUE",d:"把文本型数字转成真正的数值，「看着是数字却求不了和」的解药",s:"=VALUE(文本)",ex:['=VALUE("123") → 123（从文本变成可计算数字）']},
{n:"NUMBERVALUE",newx:1,d:"按指定小数/千位分隔符把文本转数字（处理欧式格式）",s:"=NUMBERVALUE(文本, [小数点], [千位符])",ex:['=NUMBERVALUE("1.234,56", ",", ".") → 1234.56']},
{n:"EXACT",d:"严格比较两段文本是否完全一致（区分大小写）",s:"=EXACT(文本1, 文本2)",ex:['=EXACT("ABC", "abc") → FALSE']},
{n:"REPT",d:"按次数重复文本，做简易条形图、分隔线",s:"=REPT(文本, 次数)",fx:{cols:["姓名","得分","图示"],rows:[["姓名","得分","图示"],["张三","85",""],["李四","52",""],["王五","90",""]],formulas:[{fx:"=REPT(\"▮\", B2/5)",cell:[1,2]},{fx:"=REPT(\"▮\", B3/5)",cell:[2,2]},{fx:"=REPT(\"▮\", B4/5)",cell:[3,2]}],note:"用重复字符做迷你条形图！改分数看条子长短变化。除以 5 是为了控制长度。"}},
{n:"CHAR",d:"按 ASCII 码返回字符（10=换行、65=A）",s:"=CHAR(数字)",ex:['=CHAR(65) → A','=SUBSTITUTE(A2, CHAR(10), " ") → 把换行符换成空格']},
{n:"CODE",d:"返回字符的 ASCII 码",s:"=CODE(文本)",ex:['=CODE("A") → 65']},
{n:"UNICHAR",newx:1,d:"按 Unicode 码返回字符（支持中文、符号、Emoji）",s:"=UNICHAR(数字)",ex:["=UNICHAR(9731) → ☃"]},
{n:"UNICODE",newx:1,d:"返回字符的 Unicode 码",s:"=UNICODE(文本)",ex:['=UNICODE("中") → 20013']},
{n:"CLEAN",d:"清除文本中不可打印的乱字符，网页复制内容清洗",s:"=CLEAN(文本)",ex:["=CLEAN(A2) → 去掉换行符等不可见字符"]},
{n:"DOLLAR",d:"把数字转成货币格式文本",s:"=DOLLAR(数值, [小数位])",ex:["=DOLLAR(1234.5) → ¥1,234.50"]},
{n:"FIXED",d:"按指定位数四舍五入并转千分位文本",s:"=FIXED(数值, [小数位], [去千分位])",ex:["=FIXED(1234567.891, 1) → 1,234,567.9"]},
{n:"TEXTBEFORE",newx:1,d:"返回指定分隔符之前的文本",s:"=TEXTBEFORE(文本, 分隔符)",ex:['=TEXTBEFORE("张三-技术部", "-") → 张三']},
{n:"TEXTAFTER",newx:1,d:"返回指定分隔符之后的文本",s:"=TEXTAFTER(文本, 分隔符)",ex:['=TEXTAFTER("张三-技术部", "-") → 技术部']},
{n:"TEXTSPLIT",newx:1,d:"按分隔符把文本拆成数组（一秒拆多列）",s:"=TEXTSPLIT(文本, [按列拆], [按行拆])",ex:['=TEXTSPLIT("Excel,函数,公式", ",") → 三个格子各一个词']},
{n:"T",d:"值是文本就返回，否则返回空（过滤数字）",s:"=T(值)",ex:['=T("abc") → abc','=T(123) → 空']},
{n:"ARRAYTOTEXT",newx:1,d:"把数组转成文本形式",s:"=ARRAYTOTEXT(数组)",ex:["=ARRAYTOTEXT(A1:A3) → 1, 2, 3"]},
{n:"VALUETOTEXT",newx:1,d:"把任意值转成文本",s:"=VALUETOTEXT(值)",ex:["=VALUETOTEXT(123) → \"123\""]},
{n:"PHONETIC",d:"提取文本字符串中的拼音字符（WPS 支持更好）",s:"=PHONETIC(引用)",ex:["=PHONETIC(A2) → 提取注音内容"]},
{n:"ASC",d:"全角字符转半角",s:"=ASC(文本)",ex:['=ASC("Ｅｘｃｅｌ") → Excel']},
{n:"JIS",d:"半角字符转全角",s:"=JIS(文本)",ex:['=JIS("Excel") → Ｅｘｃｅｌ']},

{n:"RIGHTB",d:"按字节从右侧截取",s:"=RIGHTB(文本, 字节数)",ex:['=RIGHTB("函数abc", 3) → abc']},
{n:"SEARCHB",d:"按字节查找位置",s:"=SEARCHB(字符, 文本, [起始字节])",ex:['=SEARCHB("a", "函数abc") → 6']}

{cat:"财务",total:53,fns:[
{n:"PMT",hot:1,d:"计算贷款每月还款额（等额本息），房贷车贷必备",s:"=PMT(年利率/12, 总月数, 贷款总额)",fx:{cols:["项目","值"],rows:[["项目","值"],["贷款总额(元)","1000000"],["年利率","5%"],["年限(年)","30"],["每月还款(元)",""]],formulas:[{fx:"=PMT(B3/12, B4*12, B2)",cell:[4,1]}],note:"结果为负表示现金支出。把年利率改成 4%、年限改成 20，亲眼看月供怎么变。这是买房贷款测算的核心公式。"}},
{n:"PPMT",d:"贷款某一期还款中的本金部分（与 IPMT 相加恰好等于 PMT）",s:"=PPMT(利率/12, 第几期, 总期数, 贷款额)",ex:["=PPMT(5%/12, 1, 360, 1000000) → 第 1 个月还的本金约 -1203"]},
{n:"IPMT",d:"贷款某一期还款中的利息部分，等额本息前期利息占大头",s:"=IPMT(利率/12, 第几期, 总期数, 贷款额)",ex:["=IPMT(5%/12, 1, 360, 1000000) → 第 1 个月利息约 -4166.67"]},
{n:"FV",d:"计算定期储蓄 / 投资的到期本息合计",s:"=FV(年利率/12, 总月数, -每月存入, [期初本金])",fx:{cols:["项目","值"],rows:[["项目","值"],["年利率","3%"],["存款年限(年)","5"],["每月存入(元)","2000"],["期初一笔(元)","50000"],["到期本息",""]],formulas:[{fx:"=FV(B2/12, B3*12, -B4, -B5)",cell:[5,1]},{fx:"=B4*12*B3*12*0+B4*12*B4*0+B4*12",cell:[4,1]}],note:"每月存 2000、年化 3%、5 年、外加期初 5 万：到期本息一目了然。第二条公式算的是纯本金合计 120000，对比看利息有多少。把第二条改成 =B3*12*B4 也可以。"}},
{n:"PV",d:"现值：未来一笔钱折算到今天值多少",s:"=PV(折现率, 期数, -每期现金流, [期末值])",ex:["=PV(5%/12, 360, -5368) → 每月还 5368 共 30 年，相当于现在借了约 100 万"]},
{n:"RATE",d:"反推实际利率：根据期数、每期还款额算出真实年化，识破「手续费」套路",s:"=RATE(总期数, -每期还款, 贷款额)",ex:["=RATE(12, -900, 10000)*12 → 名义借 1 万每月还 900，真实年化约 19%"]},
{n:"NPER",d:"反推需要多少期才能还清 / 存够目标",s:"=NPER(利率/12, -每月还款, 贷款额)",ex:["=NPER(5%/12, -10000, 1000000) → 每月还 1 万，约 116 个月还清"]},
{n:"NPV",d:"净现值：按折现率把未来现金流折算到今天，评估项目值不值",s:"=NPV(折现率, 现金流区域)",ex:["=NPV(8%, B2:B6)+B1 → 期初投入写负数放 B1，结果大于 0 即可投"]},
{n:"XNPV",newx:1,d:"不规则日期现金流的净现值（比 NPV 更贴近实际项目）",s:"=XNPV(折现率, 现金流, 日期区域)",ex:["=XNPV(8%, B2:B6, A2:A6)"]},
{n:"IRR",d:"内部收益率：一串现金流的真实年化回报率",s:"=IRR(现金流区域)",ex:["=IRR(B1:B6) → 含期初投入的现金流序列，结果即年化收益率"]},
{n:"MIRR",newx:1,d:"修正内部收益率：再投资收益率分开假设，更保守可靠",s:"=MIRR(现金流, 融资利率, 再投资利率)",ex:["=MIRR(B1:B6, 6%, 8%)"]},
{n:"XIRR",newx:1,d:"不规则日期现金流的内部收益率",s:"=XIRR(现金流, 日期区域, [猜测值])",ex:["=XIRR(B2:B6, A2:A6)"]},
{n:"ISPMT",d:"等额本金下某一期的利息（与 IPMT 的等额本息不同）",s:"=ISPMT(利率, 第几期, 总期数, 贷款额)",ex:["=ISPMT(5%/12, 1, 360, 1000000)"]},
{n:"RRI",d:"一笔投资从期初到期末的等效复利利率",s:"=RRI(期数, 现值, 终值)",ex:["=RRI(10, 100000, 200000) → 年化约 7.18%"]},
{n:"FVSCHEDULE",d:"按一组变化利率计算到期本金（利率逐年变时用）",s:"=FVSCHEDULE(本金, 利率序列)",ex:["=FVSCHEDULE(100000, B2:B4) → 利率 3%、4%、5% 三年后"]},
{n:"CUMIPMT",newx:1,d:"计算第 start 到 end 期累计支付的利息总额",s:"=CUMIPMT(利率/12, 总期数, 本金, 起期, 止期, 0)",ex:["=CUMIPMT(5%/12, 360, 1000000, 1, 12, 0) → 首年付的全部利息"]},
{n:"CUMPRINC",newx:1,d:"计算第 start 到 end 期累计偿还的本金总额",s:"=CUMPRINC(利率/12, 总期数, 本金, 起期, 止期, 0)",ex:["=CUMPRINC(5%/12, 360, 1000000, 1, 12, 0) → 首年还掉的本金"]},
{n:"EFFECT",d:"名义利率转实际年利率（考虑复利次数）",s:"=EFFECT(名义利率, 每年复利次数)",ex:["=EFFECT(10%, 12) → 月复利下实际年化 10.47%"]},
{n:"NOMINAL",d:"实际利率转名义利率（EFFECT 的反函数）",s:"=NOMINAL(实际利率, 每年复利次数)",ex:["=NOMINAL(10.47%, 12) → 10%"]},
{n:"SLN",d:"直线法折旧：每年折旧额 =（原值-残值）÷ 年限",s:"=SLN(原值, 残值, 年限)",ex:["=SLN(100000, 10000, 5) → 每年折旧 18000"]},
{n:"SYD",d:"年数总和法折旧：前期折旧多、后期少",s:"=SYD(原值, 残值, 年限, 第几年)",ex:["=SYD(100000, 10000, 5, 1) → 第一年折旧 30000"]},
{n:"DDB",d:"双倍余额递减法折旧：加速折旧",s:"=DDB(原值, 残值, 年限, 第几年, [倍数])",ex:["=DDB(100000, 10000, 5, 1) → 第一年 40000"]},
{n:"DB",d:"固定余额递减法折旧",s:"=DB(原值, 残值, 年限, 第几年, [月份数])",ex:["=DB(100000, 10000, 5, 1)"]},
{n:"AMORDEGRC",newx:1,d:"折旧系数法（法国会计系统），按资产寿命分段折旧",s:"=AMORDEGRC(原值, 购入日, 首期末日, 残值, 期数, 折旧率)",ex:["=AMORDEGRC(3000, \"2024-1-1\", \"2024-12-31\", 300, 1, 0.5)"]},
{n:"AMORLINC",newx:1,d:"线性折旧（法国会计系统），每期等额折旧",s:"=AMORLINC(原值, 购入日, 首期末日, 残值, 期数, 折旧率)",ex:["=AMORLINC(3000, \"2024-1-1\", \"2024-12-31\", 300, 1, 0.5)"]}

"MID":[["起始位置从 0 数","MID 从 1 开始，写 0 会报 #VALUE!"],["中文和英文长度不同","LEN 中文算 1 个字符；LENB 才算字节"]],

"RANK":[["并列会跳号","两个第 1 名后面直接是第 3 名；要中国式排名用 COUNTIF($A$2:$A$10,\">\"&A2)+1"],["区域没锁","第 2 参数要绝对引用，否则拖公式会错"]],
"SUMPRODUCT":[["区域大小不一致","多个数组必须同样大小，否则 #VALUE!"],["文本参与乘法","空文本会变成 #VALUE!，加 -- 或 *1 前先确认数据干净"]],
"PMT":[["利率没换成月利率","年利率 4.2% 要写 4.2%/12，期数要写 25*12"],["结果是负数","负数表示现金流出，外套 ABS() 显示正数即可"]],

"COUNTIFS":[["条件区域高度不一致","所有区域必须一样高，和 SUMIFS 一样"]],

"FILTER":[["结果区域被占","动态数组会溢出，下方有内容会报 #SPILL!，先清空"],["条件数组长度不对","条件要和数据区域同高，如 B2:B7=\"技术部\""]],

/* 解析签名里的参数（跳过引号内逗号与嵌套括号） */
function argSplitInner(inner){
 const out=[];let d=0,cur="",q=false;
 for(const ch of inner){
  if(ch==='"')q=!q;
  if(!q&&ch==="(")d++;
  else if(!q&&ch===")")d--;
  if(!q&&ch===","&&d===0){out.push(cur);cur=""}
  else cur+=ch;
 }
 if(cur.trim())out.push(cur);
 return out.map(x=>x.trim()).filter(Boolean);
}
function sigOf(f){return SIGFIX[f.n]||f.s||""}
function fnHead(sig){
 const m=/^=?([A-Za-z0-9._\u4e00-\u9fa5 +/]+?)\s*\(/.exec(sig||"");
 return m?m[1].trim():"";
}
/* 返回参数行：[{name,req,desc,opt,def,vary}] */
function argRows(f){
 const sig=sigOf(f);
 const i=sig.indexOf("("),j=sig.lastIndexOf(")");
 if(i<0||j<=i)return null;
 const raw=argSplitInner(sig.slice(i+1,j));
 if(!raw.length)return [{name:"（无参数）",req:"—",desc:"这个函数不需要填参数，直接写括号就行，如 "+sig,opt:"",def:"",vary:false}];
 const det=ARGD[f.n]||null;
 const out=[];
 raw.forEach((p,idx)=>{
  let t=p.trim();const opt=/\[/.test(t);
  t=t.replace(/[\[\]]/g,"").trim();
  if(/^[…\.]+$/.test(t)){                       // 纯省略号 → 标记上一个参数可变长
   if(out.length)out[out.length-1].vary=true;
   return;
  }
  const vary=/…$/.test(t);
  t=t.replace(/…$/,"").trim();
  const d=det&&det[idx]?det[idx]:null;
  out.push({
   name:t.replace(/^\d+、$/,""),
   req:opt?"选填":"必填",
   desc:d?d[2]:(PARAM_META[t]||""),
   opt:d?(d[3]||""):"",
   def:d?(d[4]||""):"",
   vary:vary
  });
 });
 return out.length?out:null;
}

/* ================= 补实现 RANK ================= */
FN.RANK=(a,ctx)=>{const v=n2(sc(ev(a[0],ctx)));if(ise(v))return v;const arr=nums([ev(a[1],ctx)]);if(ise(arr))return arr;const ord=a.length>2?n2(sc(ev(a[2],ctx))):0;let c=0;for(const x of arr){if(ord?x<v:x>v)c++}return c+1};

/* ================= 基础工具 ================= */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function txtOf(v){
 if(ise(v))return v.e;
 if(typeof v==="boolean")return v?"TRUE":"FALSE";
 if(Array.isArray(v)){const f=flat(v);if(!f.length)return "(空)";if(f.every(x=>Array.isArray(x)))return "（"+f.length+" 行结果）";return f.slice(0,6).map(x=>ise(x)?x.e:txtOf(x)).join(", ")+(f.length>6?" …":"")}
 if(typeof v==="number"){if(!isFinite(v))return String(v);const r=Math.round(v*1e6)/1e6;return r.toLocaleString("zh-CN",{maximumFractionDigits:6})}
 return String(v);
}
function fmtStep(v){if(Array.isArray(v)){const f=flat(v);return f.length+" 项："+f.slice(0,3).map(x=>ise(x)?x.e:txtOf(x)).join(",")+(f.length>3?"…":"")}return txtOf(v)}
function nodeSrc(n){
 switch(n.f){
  case"num":return String(n.v);case"str":return '"'+n.v+'"';case"bool":return n.v?"TRUE":"FALSE";case"err":return n.v;
  case"ref":return colL(n.v.c)+n.v.r;
  case"range":return colL(n.v[0].c)+n.v[0].r+":"+colL(n.v[1].c)+n.v[1].r;
  case"neg":return "-"+nodeSrc(n.v);case"pct":return nodeSrc(n.v)+"%";
  case"cat":return nodeSrc(n.l)+"&"+nodeSrc(n.r);
  case"bin":return "("+nodeSrc(n.l)+n.o+nodeSrc(n.r)+")";
  case"cmp":return "("+nodeSrc(n.l)+n.o+nodeSrc(n.r)+")";
  case"call":return n.n+"("+n.a.map(nodeSrc).join(", ")+")";
  case"name":return n.v;
 }
 return "?";
}
function tev(n,ctx,rec){
 switch(n.f){
  case"num":case"str":case"bool":return n.v;
  case"err":return XE(n.v);
  case"name":return XE("#NAME?");
  case"ref":{const v=getCell(ctx,n.v);rec.push({s:nodeSrc(n),v});return v}
  case"range":return getRange(ctx,n.v);
  case"neg":{const v=tev(n.v,ctx,rec);if(ise(sc(v)))return sc(v);const r=zip(v,v,x=>{const y=n2(x);return ise(y)?y:-y});rec.push({s:nodeSrc(n),v:r});return r}
  case"pct":{const v=tev(n.v,ctx,rec);if(ise(sc(v)))return sc(v);const r=zip(v,v,x=>{const y=n2(x);return ise(y)?y:y/100});rec.push({s:nodeSrc(n),v:r});return r}
  case"cat":{const a=tev(n.l,ctx,rec),b=tev(n.r,ctx,rec);const r=zip(a,b,(x,y)=>{if(ise(x))return x;if(ise(y))return y;return s2(x)+s2(y)});rec.push({s:nodeSrc(n),v:r});return r}
  case"bin":{const a=tev(n.l,ctx,rec),b=tev(n.r,ctx,rec);const r=zip(a,b,(x,y)=>{if(ise(x))return x;if(ise(y))return y;const u=n2(x),w=n2(y);if(ise(u))return u;if(ise(w))return w;switch(n.o){case"+":return u+w;case"-":return u-w;case"*":return u*w;case"/":return w===0?XE("#DIV/0!"):u/w;case"^":return Math.pow(u,w)}return XE("#VALUE!")});rec.push({s:nodeSrc(n),v:r});return r}
  case"cmp":{const a=tev(n.l,ctx,rec),b=tev(n.r,ctx,rec);const r=zip(a,b,(x,y)=>{if(ise(x))return x;if(ise(y))return y;const c=cmpv(x,y);switch(n.o){case"=":return c===0;case"<>":return c!==0;case"<":return c<0;case">":return c>0;case"<=":return c<=0;case">=":return c>=0}return XE("#VALUE!")});rec.push({s:nodeSrc(n),v:r});return r}
  case"call":{n.a.forEach(x=>tev(x,ctx,rec));const v=callFn(n.n,n.a,ctx);rec.push({s:nodeSrc(n),v});return v}
 }
 return XE("#VALUE!");
}

  box.innerHTML=h;box.hidden=false;
 }
 bind();render();st.recalc=recalc;return st;

let SIDX=null;
function buildIdx(){SIDX=[];DB.forEach((c,ci)=>c.fns.forEach((f,fi)=>{
  const ps=(typeof argRows==="function"&&argRows(f))||[];
  const pa=ps.map(p=>p.name+" "+(p.desc||"")+" "+(p.opt||"")+" "+(p.def||"")).join(" ").toLowerCase();
  SIDX.push({f,ci,fi,cat:c.cat,pa,t:((f.n||"")+" "+(f.d||"")+" "+(sigText(f)||"")+" "+(f.ex?f.ex.join(" "):"")+" "+c.cat).toLowerCase()});
 }))}
function hl(t,q){if(!q)return esc(t);const i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))}
function runSearch(raw){
 const q=raw.trim();const v=q.toLowerCase();
 if(!SIDX)buildIdx();
 // 同义词提升表：支持精确词、包含词、被包含词三种匹配
 const BOOST={};
 Object.keys(KW).forEach(k=>{
  let w=0;
  if(k===q)w=74;
  else if(k.length>=2&&q.indexOf(k)>-1)w=62;
  else if(q.length>=2&&k.indexOf(q)>-1)w=54;
  if(!w)return;
  KW[k].forEach((n,i)=>{const s=w-i*3;if(!BOOST[n]||BOOST[n]<s)BOOST[n]=s});
 });
 const tokens=v.split(/\s+/).filter(Boolean);
 const scoreOf=(it,tk,strictName)=>{
  const n=it.f.n.toLowerCase();
  if(n===tk)return 100;if(n.indexOf(tk)===0)return 88;if(n.indexOf(tk)>-1)return 66;
  if(it.f.d&&it.f.d.toLowerCase().indexOf(tk)>-1)return 36;
  if(it.pa&&it.pa.indexOf(tk)>-1)return 44;
  if(it.f.s&&it.f.s.toLowerCase().indexOf(tk)>-1)return 24;
  if(it.t.indexOf(tk)>-1)return 14;
  return 0;
 };
 const hits=[];
 const gather=(all)=>{
  const res=[];
  SIDX.forEach(it=>{
   let sc=0;
   if(tokens.length>1&&all){
    const ss=tokens.map(tk=>scoreOf(it,tk));
    if(ss.some(x=>!x))return;
    sc=Math.min.apply(null,ss)+12;
   }else if(tokens.length>1){
    sc=tokens.reduce((s,tk)=>s+scoreOf(it,tk),0);
    if(sc)sc=Math.min(sc,60)-4;
   }else{
    sc=scoreOf(it,v);
    if(!sc&&BOOST[it.f.n])sc=BOOST[it.f.n];
   }
   if(sc)res.push({f:it.f,ci:it.ci,fi:it.fi,sc});
  });
  return res;
 };
 hits.push.apply(hits,gather(true));
 if(!hits.length&&tokens.length>1)hits.push.apply(hits,gather(false));
 hits.sort((a,b)=>b.sc-a.sc);
 const sh=SCENES.filter(s=>s.name.indexOf(q)>-1||s.sub.indexOf(q)>-1||s.tpls.some(t=>t.t.indexOf(q)>-1));
 const eh=ERRORS.filter(e=>e.code.toLowerCase().indexOf(v)>-1||e.name.indexOf(q)>-1);
 let h='<div class="lthead"><h2>搜索「'+esc(q)+'」</h2><span>'+hits.length+" 个函数"+(sh.length?" · "+sh.length+" 个场景":"")+(eh.length?" · "+eh.length+" 个报错":"")+"</span></div>";
 if(sh.length){
  h+='<div class="sect">场景里也有</div><div class="relchips">';
  sh.forEach(s=>h+='<span class="relchip" onclick="openScene(\''+s.id+'\')">'+esc(s.name)+" · "+esc(s.sub)+"</span>");
  h+="</div>";
 }
 if(eh.length){
  h+='<div class="sect">报错诊断</div><div class="relchips">';
  eh.forEach(e=>h+='<span class="relchip" onclick="nav(\'debug\');S.dbgTab=\'err\';renderDebug()">'+esc(e.code)+" "+esc(e.name)+"</span>");
  h+="</div>";
 }
 h+=hits.length?'<div class="grid" style="margin-top:12px">'+hits.slice(0,60).map(x=>{
  const col=CC[DB[x.ci].cat]||["#0B6E4F","#E3F2EA"];const k=fkey(x.ci,x.fi);
  return '<div class="fcard" style="--cc:'+col[0]+'" onclick="openFn('+x.ci+","+x.fi+')"><button class="fs'+(isFav(k)?" on":"")+'" onclick="event.stopPropagation();favCard(this,\''+esc(k).replace(/'/g,"\\'")+'\')">'+(isFav(k)?"★":"☆")+'</button><div class="nm"><b>'+hl(x.f.n,q)+"</b>"+(x.f.hot?'<span class="badge b-hot">高频</span>':"")+'</div><p>'+hl(x.f.d,q)+"</p></div>";
 }).join("")+"</div>":'<div class="empty">没有找到「'+esc(q)+'」<br>试试这些词：求和 · 日期差 · 月供 · 查重 · 排名 · 脱敏 · 工作日 · 反向查找</div>';
 document.getElementById("libmain").innerHTML=h;
}

/* ---------- 相似函数对比 ---------- */
function cmpHit(cp,q){
 if(!q)return true;
 const blob=[cp.title,cp.sub,cp.pick,cp.note,(cp.fns||[]).join(" "),(cp.when||[]).map(w=>w[0]+" "+w[1]).join(" "),cp.rows.map(r=>r.join(" ")).join(" ")].join(" ").toLowerCase();
 return blob.indexOf(q)>-1;
}
function cmpCats(){
 const total=COMPARE.length;
 let h='<button class="cmpcat'+(S.cmpCat?"":" on")+'" onclick="S.cmpCat=\'\';renderDebug()">全部 '+total+"</button>";
 CMPCATS.forEach(c=>{
  const n=COMPARE.filter(x=>x.cat===c).length;
  if(!n)return;
  h+='<button class="cmpcat'+(S.cmpCat===c?" on":"")+'" onclick="S.cmpCat=\''+c+'\';renderDebug()">'+c+" "+n+"</button>";
 });
 return h;
}
function cmpCards(q,cat){
 const kw=String(q||"").trim().toLowerCase();
 const list=COMPARE.filter(cp=>(!cat||cp.cat===cat)&&cmpHit(cp,kw));
 if(!list.length)return '<div class="empty">没找到「'+esc(q)+'」<br>试试：查找、逆向、去重、求和、取整、日期差、月供</div>';
 return list.map(cp=>{
  let c='<div class="cmp" id="cmp-'+cp.id+'">';
  c+='<div class="cmphead"><h3>'+esc(cp.title)+'</h3><span class="cmpcat2">'+esc(cp.cat)+"</span></div>";
  c+='<p class="v">'+esc(cp.sub)+"</p>";
  if(cp.fns&&cp.fns.length)c+='<div class="cmpfns">'+cp.fns.map(n=>'<span class="relchip" onclick="openByName(\''+esc(n)+'\')">'+esc(n)+"</span>").join("")+"</div>";
  c+='<div class="cmpwrap"><table class="cmptable"><tr>'+cp.head.map((x,i)=>"<th"+(i===0?' style="width:104px"':"")+">"+esc(x)+"</th>").join("")+"</tr>";
  cp.rows.forEach(r=>{c+="<tr>"+r.map((x,i)=>"<td"+(i===0?' class="cmk"':"")+">"+esc(x)+"</td>").join("")+"</tr>"});
  c+="</table></div>";
  c+='<div class="pick">'+esc(cp.pick)+"</div>";
  if(cp.when&&cp.when.length){
   c+='<div class="whenbox"><b>什么时候用哪个</b><ul>'+cp.when.map(w=>'<li><span class="wq">'+esc(w[0])+'</span><span class="wa">'+esc(w[1])+"</span></li>").join("")+"</ul></div>";
  }
  if(cp.note)c+='<div class="cmpnote">注意：'+esc(cp.note)+"</div>";
  return c+"</div>";
 }).join("");
}

function copyTxt(btn){

 function fb(){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);toast(ok?"已复制":"复制失败，请手动选择")}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast("已复制："+(t.length>28?t.slice(0,28)+"…":t))).catch(fb)}else fb();
}

 pick:"能用 XLOOKUP 就用；旧版本优先 INDEX+MATCH；只有临时救急才写 LOOKUP(1,0/...)。",

{id:"multi-lookup",cat:"查找匹配",title:"多条件查找：4 种做法",fns:["XLOOKUP","SUMIFS","LOOKUP","FILTER","INDEX","MATCH"],
 sub:"要同时满足「部门 + 姓名」才返回结果，单条件函数全部失效。",

 rows:[
 ["XLOOKUP 拼条件","=XLOOKUP(F2&G2,A:A&B:B,C:C)","单值","365，最快最清晰"],
 ["LOOKUP 向量","=LOOKUP(1,0/((A:A=F2)*(B:B=G2)),C:C)","单值","所有版本，兜底用"],
 ["SUMIFS","=SUMIFS(C:C,A:A,F2,B:B,G2)","数值","结果必须是数字，且唯一"],
 ["FILTER","=FILTER(C:C,(A:A=F2)*(B:B=G2))","多条记录","可能有多条，要全部列出"]],
 pick:"要一条结果用 XLOOKUP；旧版本用 LOOKUP；结果是数字且唯一，SUMIFS 最省事；可能有多条用 FILTER。",
 when:[["只想要一个值","XLOOKUP 拼条件"],["结果可能有多行","FILTER"],["结果是数字、且不会重复","SUMIFS（还能顺便求和）"],["没有 365","LOOKUP(1,0/((..)*(..)),..)"]],
 note:"SUMIFS 遇到文本结果会返回 0，很多人以为是公式写错了。"},

{id:"index-offset",cat:"引用结构",title:"INDEX vs OFFSET vs INDIRECT",fns:["INDEX","OFFSET","INDIRECT"],

 ["性能","好","大表明显变慢","最慢"],

 pick:"优先 INDEX；需要「以某格为起点扩展区域」用 OFFSET 但控制范围；INDIRECT 只在不改结构的前提下用。",

/* ---------------- 条件统计 ---------------- */

{id:"sum-subtotal",cat:"条件统计",title:"SUM vs SUBTOTAL vs AGGREGATE",fns:["SUM","SUBTOTAL","AGGREGATE"],
